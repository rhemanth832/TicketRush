name: Test and publish TicketRush
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ticketrush
          POSTGRES_PASSWORD: ticketrush
          POSTGRES_DB: ticketrush_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U ticketrush' --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd 'redis-cli ping' --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      RUN_INTEGRATION: '1'
      DATABASE_URL: postgresql://ticketrush:ticketrush@localhost:5432/ticketrush_test
      REDIS_URL: redis://localhost:6379/14
      JWT_SECRET: test-jwt-signing-secret-at-least-32-characters
      TICKET_SECRET: test-ticket-signing-secret-at-least-32-characters
      ADMIN_PASSWORD: TestAdminPassword2026!
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run test:integration
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }},${{ steps.image.outputs.name }}:latest
